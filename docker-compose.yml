services:
  pixoo-ai:
    image: pixoo-ai:1.0
    build: .
    pull_policy: build
    container_name: pixoo-ai
    restart: unless-stopped

    ports:
      - "8088:8088"

    environment:
      PIXOO_HOST: "${PIXOO_HOST:-192.168.178.188}"
      PIXOO_PATH: "${PIXOO_PATH:-/post}"
      API_TOKEN: "${API_TOKEN:-${PIXOO_API_TOKEN:-}}"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
